<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sudoku Solver</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="solver-card">

            <div class="icon">🧩</div>

            <h1>Sudoku Solver</h1>

            <p class="subtitle">
                Enter an unsolved Sudoku and let the algorithm solve it.
            </p>

            <div class="sudoku-board" id="sudokuBoard">
                <!-- Sudoku cells will be generated by JavaScript -->
            </div>

            <div class="button-group">

                <button id="solveBtn">
                    🧠 Solve Sudoku
                </button>

                <button id="clearBtn" class="secondary-btn">
                    🧹 Clear Board
                </button>

                <button id="newBtn" class="secondary-btn">
                    🔄 New Puzzle
                </button>

            </div>
            
            <div class="puzzle-info">
                <span>🧩 Puzzle: <strong id="givenCount">0</strong> given</span>
                <span>✏️ <strong id="emptyCount">81</strong> empty</span>
            </div>

            <p id="message">
                Enter numbers in the Sudoku grid.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
